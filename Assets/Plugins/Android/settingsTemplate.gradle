pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        gradlePluginPortal()
        mavenCentral()
           
        maven { url 'https://developer.huawei.com/repo/' }
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        def unityProjectPath = $/file:///**DIR_UNITYPROJECT**/$.replace("\\", "/")
        maven {
            url (unityProjectPath + "/Packages/local_packages/com.liufangzhiwu.google-ext/Firebase/m2repository") // Packages/com.liufangzhiwu.google-ext/Firebase/Editor/AnalyticsDependencies.xml:18, Packages/com.liufangzhiwu.google-ext/Firebase/Editor/AppDependencies.xml:22
        }
        maven {
            url "https://maven.google.com/" // Packages/com.liufangzhiwu.google-ext/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:7, Packages/com.liufangzhiwu.google-ext/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:12, Packages/com.liufangzhiwu.google-ext/GoogleMobileAds/Editor/GoogleUmpDependencies.xml:7
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
